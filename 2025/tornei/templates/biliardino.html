<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Torneo Biliardino</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; }
    h1 { text-align: center; }
    h2 { margin-top: 40px; text-align: center; }

    /* Wrapper globale per centrare tutto */
    .wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Container dei bracket */
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 60px;
      margin-top: 40px;
      position: relative;
      width: 100%;
    }

    .bracket { display: flex; gap: 40px; }
    .round { display: flex; flex-direction: column; justify-content: flex-start; min-height: 300px; align-items: center;}
    .match { background: white; padding: 8px; border: 1px solid #ccc; border-radius: 8px; width: 200px; margin: auto; text-align: center; }
    .team { padding: 5px; border-radius: 5px; cursor: pointer; font-weight: bold; border: 1px solid transparent; margin: 2px 0; }
    .winner { background-color: #c8e6c9; border-color: #388e3c; }
    .loser { background-color: #ffcdd2; border-color: #d32f2f; }

    button { padding: 10px 20px; margin: 20px auto; display: block; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }

    table { margin: 30px auto; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; }
    th { background: #007bff; color: white; }

    /* Finali verticali centrati */
    .finals {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-top: 30px;
    }

    .finals .match { width: 200px; }
    .final-title { text-align: center; font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h1>Torneo di Biliardino</h1>
  <button onclick="exportCSV()">Esporta risultati in CSV</button>
  <button onclick="resetTorneo()">Reset torneo</button>

  <div class="container">
    <div>
      <h2>Consolation (5º–8º)</h2>
      <div class="bracket" id="consolationBracket"></div>
    </div>
    <div>
      <h2>Main Bracket</h2>
      <div class="bracket" id="mainBracket"></div>
    </div>
  </div>

  <h2>Finali di Posizione</h2>
  <div class="finals" id="finals"></div>

  <h2>Classifica Finale</h2>
  <table id="classifica">
    <thead>
      <tr><th>Posizione</th><th>Squadra</th></tr>
    </thead>
    <tbody></tbody>
  </table>

    <script>
    let match = 0
    let round = 0
    const finals = [
    { titolo: "Finale 1º-2º posto" },
    { titolo: "Finale 3º-4º posto" },
    { titolo: "Finale 5º-6º posto" },
    { titolo: "Finale 7º-8º posto" }
    ];

    // ---------------- Bracket ----------------
    function createBracket(containerId, matchesPerRound, discipline, mirrored=false) {
    let html = '';
    matchesPerRound.forEach((numMatches, rIndex) => {
        html += '<div class="round">';
        for (let i = 0; i < numMatches; i++) {
        html += `<div class='match' data-discipline='${discipline}' data-round='${round}' data-match='${match}'>
            <div class='team'></div>
            <div class='team'></div>
        </div>`;
        match++;
        }
        html += '</div>';
        round++
    });
    const container = document.getElementById(containerId);
    container.innerHTML = html;
    if (mirrored) container.style.flexDirection = 'row-reverse';
    }

    function createFinals(containerId, finals, discipline) {
    let html = '';
    finals.forEach(final => {
        html += `<div class='match' data-discipline='${discipline}' data-round='final' data-match='${match}'>
        <div class='final-title'>${final.titolo}</div>
        <div class='team' contenteditable='true'></div>
        <div class='team' contenteditable='true'></div>
        </div>`;
        match++;
    });
    document.getElementById(containerId).innerHTML = html;
    }

    // ---------------- Inizializzazione ----------------
    createBracket("mainBracket", [4,2], "Biliardino"); // Quarti e semifinali
    createBracket("consolationBracket", [2], "Biliardino", true);
    createFinals("finals", finals, "Biliardino");

    // ---------------- Variabili ----------------
    
    const isAdmin = true; // Solo tu puoi scrivere sul foglio

    // ---------------- Salvataggio locale (backup) ----------------
    function saveData() {
        const data = [];
        document.querySelectorAll(".match").forEach(match => {
            const teams = match.querySelectorAll(".team");
            data.push(Array.from(teams).map(t => ({
                text: t.textContent,
                winner: t.classList.contains("winner")
            })));
        });
        localStorage.setItem("biliardinoData", JSON.stringify(data));
    }

    async function loadData() {
        // fetch dal file JSON locale
        const res = await fetch('/static/dati.json');
        const data = await res.json();

        document.querySelectorAll(".match").forEach(match => {
            const round = match.dataset.round;
            const matchNum = match.dataset.match;

            // Trova la riga corrispondente nel JSON
            const row = data.find(d => d.Round == round && d.Match == matchNum);
            if (row) {
                const teams = match.querySelectorAll(".team");
                teams[0].textContent = row.Squadra1 || '';
                teams[1].textContent = row.Squadra2 || '';

                teams.forEach(t => t.classList.remove("winner","loser"));
                if (row.Vincitore) {
                    if (teams[0].textContent === row.Vincitore) teams[0].classList.add("winner");
                    else if (teams[1].textContent === row.Vincitore) teams[1].classList.add("winner");
                    teams.forEach(t => {
                        if (!t.classList.contains("winner") && t.textContent) t.classList.add("loser");
                    });
                }
            }
        });

        aggiornaClassifica();
    }

    function resetTorneo() {
        localStorage.removeItem("biliardinoData");
        document.querySelectorAll(".team").forEach(t => { t.textContent = ''; t.classList.remove("winner","loser"); });
        document.querySelector("#classifica tbody").innerHTML = '';
    }

    // ---------------- Aggiornamento match e classifica ----------------
    document.addEventListener("click", async (e) => {
        if (!isAdmin) return;
        if(e.target.classList.contains("team") && e.target.textContent.trim()!=='') {
            const match = e.target.parentElement;
            const teams = match.querySelectorAll(".team");
            teams.forEach(t=>t.classList.remove("winner","loser"));
            e.target.classList.add("winner");
            teams.forEach(t=>{ if(t!==e.target) t.classList.add("loser"); });

            aggiornaTurni(match, e.target.textContent);
            saveData();
            aggiornaClassifica();

            // Salva sul foglio solo se sei admin
            
        }
    });

    function aggiornaTurni(match, winnerName) {
        const parentId = match.parentElement.parentElement.id;
        const roundIndex = parseInt(match.dataset.round);
        const matchNum = parseInt(match.dataset.match);

        if(parentId==='mainBracket'){
            if(roundIndex===0){ // Quarto → Semifinali
                const target = document.querySelector(`#mainBracket .round:nth-child(2) .match:nth-child(${Math.ceil(matchNum/2)}) .team:nth-child(${matchNum%2===1?1:2})`);
                if(target) target.textContent = winnerName;

                const loserName = [...match.querySelectorAll('.team')].find(t=>t.textContent!==winnerName).textContent;
                const consTarget = document.querySelector(`#consolationBracket .round:nth-child(1) .match:nth-child(${Math.ceil(matchNum/2)}) .team:nth-child(${matchNum%2===1?1:2})`);
                if(consTarget && !consTarget.textContent) consTarget.textContent = loserName;
            } else if(roundIndex===1){ // Semifinali → Finali centrali
                const finalsTargets = document.querySelectorAll(`#finals .match`);
                if(matchNum===1){
                    finalsTargets[0].querySelectorAll('.team')[0].textContent = winnerName;
                    finalsTargets[1].querySelectorAll('.team')[0].textContent = [...match.querySelectorAll('.team')].find(t=>t.textContent!==winnerName).textContent;
                } else if(matchNum===2){
                    finalsTargets[0].querySelectorAll('.team')[1].textContent = winnerName;
                    finalsTargets[1].querySelectorAll('.team')[1].textContent = [...match.querySelectorAll('.team')].find(t=>t.textContent!==winnerName).textContent;
                }
            }
        } else if(parentId==='consolationBracket'){
            if(roundIndex===0){ // Semifinali consolazione
                const finalsTargets = document.querySelectorAll(`#finals .match`);
                if(matchNum===1){
                    finalsTargets[2].querySelectorAll('.team')[0].textContent = winnerName;
                    finalsTargets[3].querySelectorAll('.team')[0].textContent = [...match.querySelectorAll('.team')].find(t=>t.textContent!==winnerName).textContent;
                } else if(matchNum===2){
                    finalsTargets[2].querySelectorAll('.team')[1].textContent = winnerName;
                    finalsTargets[3].querySelectorAll('.team')[1].textContent = [...match.querySelectorAll('.team')].find(t=>t.textContent!==winnerName).textContent;
                }
            }
        }
    }

    function aggiornaClassifica(){
        const tbody = document.querySelector("#classifica tbody");
        tbody.innerHTML='';
        const finalMatches = document.querySelectorAll("#finals .match");
        const posizioni = ["1º","3º","5º","7º"];
        finalMatches.forEach((match, idx)=>{
            const teams = match.querySelectorAll(".team");
            let winner='', loser='';
            if(teams[0].classList.contains('winner')){ winner=teams[0].textContent; loser=teams[1].textContent; }
            else if(teams[1].classList.contains('winner')){ winner=teams[1].textContent; loser=teams[0].textContent; }
            else{ winner=teams[0].textContent; loser=teams[1].textContent; }
            if(winner && loser){
                tbody.innerHTML+=`<tr><td>${posizioni[idx]}</td><td>${winner}</td></tr>`;
                tbody.innerHTML+=`<tr><td>${parseInt(posizioni[idx])+1}º</td><td>${loser}</td></tr>`;
            }
        });
    }

    // ---------------- CSV ----------------
    function exportCSV(){
        let rows=['MATCHES'];
        rows.push('Disciplina,Turno,Match,Squadra 1,Squadra 2,Vincitore');

        document.querySelectorAll(".match").forEach(match=>{
            const discipline=match.dataset.discipline;
            const round=match.dataset.round;
            const matchNum=match.dataset.match;
            const teams=match.querySelectorAll('.team');
            const team1=teams[0].textContent;
            const team2=teams[1]?teams[1].textContent:'';
            let winner='';
            if(teams[0].classList.contains('winner')) winner=team1;
            else if(teams[1].classList.contains('winner')) winner=team2;
            rows.push(`${discipline},${round},${matchNum},${team1},${team2},${winner}`);
        });

        rows.push(''); // separatore
        rows.push('FINAL RANKING');
        rows.push('Posizione,Squadra');

        const finalMatches = document.querySelectorAll("#finals .match");
        const posizioni = ["1º","3º","5º","7º"];
        finalMatches.forEach((match, idx)=>{
            const teams = match.querySelectorAll(".team");
            let winner='', loser='';
            if(teams[0].classList.contains('winner')){ winner=teams[0].textContent; loser=teams[1].textContent; }
            else if(teams[1].classList.contains('winner')){ winner=teams[1].textContent; loser=teams[0].textContent; }
            else{ winner=teams[0].textContent; loser=teams[1].textContent; }
            if(winner && loser){
                rows.push(`${posizioni[idx]},${winner}`);
                rows.push(`${parseInt(posizioni[idx])+1}º,${loser}`);
            }
        });

        const csvContent = rows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href=url;
        a.download='risultati_biliardino.csv';
        a.click();
    }

    async function saveMatch(discipline, round, matchNum, team1, team2, winner){
        const body = {
            Disciplina: discipline,
            Round: round,
            Match: matchNum,
            Squadra1: team1,
            Squadra2: team2,
            Vincitore: winner
        };

        await fetch('/save_match', {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(body)
        });
    }

    // Aggiornamento automatico ogni 5 secondi
    window.onload = loadData;
    </script>
</body>
</html>
